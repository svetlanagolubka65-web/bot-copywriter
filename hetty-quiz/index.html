const questions = [
 ['Где возникло Хеттское государство?', ['В Месопотамии','В Малой Азии','В долине Нила'], [1]],
 ['В каком веке образовалось единое Хеттское царство?', ['В XII веке до н. э.','В XIV веке до н. э.','В XVII веке до н. э.'], [2]],
 ['Почему расположение Малой Азии было выгодно для торговли?', ['Через неё проходили пути между Передней Азией и Европой','По ней протекал Нил','Она была изолирована от соседей'], [0]],
 ['Какие природные богатства Малой Азии названы в параграфе?', ['Медь','Нефть','Золото','Железная руда','Каменный уголь'], [0,2,3]],
 ['Почему умение выплавлять железо помогало укреплять державу?', ['Железом заменили все деньги','Из железа делали орудия труда и оружие','Железо использовали только для украшений'], [1]],
 ['Из каких двух частей состояло хеттское войско, описанное в параграфе?', ['Пехота и боевые колесницы','Пехота и флот','Флот и конница'], [0]],
 ['Хеттов называли народом «тысячи богов». Верно ли это?', ['Верно','Неверно'], [0]],
 ['Какое природное явление олицетворял верховный бог хеттов?', null, ['гроза','грозы']],
 ['Какие обязанности выполнял хеттский царь?', ['Командовал войском','Был верховным судьёй','Был верховным жрецом','Служил послом другого государства'], [0,1,2]],
 ['Соотнеси события и даты.', ['Около 1200 г. до н. э.','XVII в. до н. э.','XIV–XIII вв. до н. э.'], [1,2,0], ['Образование царства','Наивысшее могущество державы','Падение державы']]
];
const panel = document.querySelector('#panel');
const hero = document.querySelector('#hero');
const outfit = document.querySelector('#outfit');
let index = 0, score = 0, mistakes = [];
function updateHero() {
 const stage = score === 10 ? 3 : score >= 6 ? 2 : score >= 3 ? 1 : 0;
 if (hero.getAttribute("src") !== art[stage]) hero.src = art[stage];
 hero.style.transform = 'scale(' + (0.48 + score * 0.052) + ')';
 outfit.textContent = ['Путешественник','Узорчатый пояс','Синий плащ','Глиняная табличка'][stage];
}
function showQuestion(focus = false) {
 const [title, options, key, events] = questions[index];
 const multiple = options && key.length > 1 && !events;
 const controls = events ? events.map(event => '<label>'+event+' <select required><option value="">Выбери дату</option>'+options.map((date,i)=>'<option value="'+i+'">'+date+'</option>').join('')+'</select></label>').join('')
 : options ? options.map((option,i)=>'<label><input name="choice" type="'+(multiple?'checkbox':'radio')+'" value="'+i+'"> '+option+'</label>').join('')
 : '<label>Впиши одно слово<br><input type="text" required autocomplete="off"></label>';
 panel.innerHTML = '<small>Вопрос '+(index+1)+' из 10 · Верных ответов: <strong id="score">'+score+'</strong></small><progress value="'+index+'" max="10" aria-label="Пройдено вопросов"></progress><h2 tabindex="-1">'+title+'</h2><form>'+(multiple?'<p>Выбери три ответа.</p>':'')+controls+'<p id="feedback" role="status"></p><button>Проверить ответ</button></form>';
 if(focus) panel.querySelector('h2').focus();
 const form = panel.querySelector('form');
 form.onsubmit = event => {
  event.preventDefault();
  const feedback = panel.querySelector('#feedback');
  const chosen = options ? [...form.querySelectorAll(events?'select':'input:checked')].map(el=>Number(el.value)) : form.querySelector('input').value.trim().toLowerCase().replace(/[.!?]+$/,'');
  if (chosen.length === 0) {feedback.textContent = 'Сначала укажи ответ.'; return;}
  const correct = options ? chosen.length === key.length && chosen.every((value,i)=>value===key[i]) : key.includes(chosen);
  const answer = options ? key.map((value,i)=>(events?events[i]+' — ':'')+options[value]).join(' · ') : key[0];
  if(correct){score++;updateHero();}else{mistakes.push([title,answer]);}
  panel.querySelector('#score').textContent = score;
  panel.querySelector('progress').value = index+1;
  feedback.textContent = correct ? 'Верно! Герой подрос.' : 'Правильный ответ — '+answer+'.';
  form.querySelectorAll('input,select').forEach(el=>el.disabled=true);
  const button = form.querySelector('button');
  button.type='button';
  button.textContent = index === 9 ? 'Посмотреть результат' : 'Следующий вопрос';
  button.onclick = () => {index++;if(index===10) showResult();else showQuestion(true);};
  form.onsubmit = event => event.preventDefault();
 };
}
function showResult() {
 panel.innerHTML = '<h2 tabindex="-1">Квиз завершён</h2><p><strong>Верных ответов: '+score+' из 10</strong></p><p>Отметка в этом квизе — <strong>'+Math.max(1,score)+'</strong> по 10-балльной шкале.</p>'+(mistakes.length?'<h3>Что повторить</h3><ul>'+mistakes.map(([q,a])=>'<li>'+q+' <strong>'+a+'</strong></li>').join('')+'</ul>':'<p>Ты открыл все образы путешественника!</p>')+'<button>Пройти ещё раз</button>';
 panel.querySelector('h2').focus();
 panel.querySelector('button').onclick=()=>{index=0;score=0;mistakes=[];updateHero();showQuestion(true);};
}
updateHero();
showQuestion();
</script></html>
